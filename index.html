<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fretboard Notes</h1>
    <div class="controls">
        <div class="preset-row">
            <label for="preset">Tuning</label>
            <select id="preset"></select>
        </div>
        <div class="tuning-row" id="tuning-selects"></div>
    </div>
    <div class="chord-row">
        <input type="text" id="chord-input" placeholder="Chord (e.g. Cmaj7, Am, G7)" spellcheck="false">
        <select id="chord-root"></select>
        <select id="chord-type"></select>
        <div class="chord-display">
            <div id="chord-name"></div>
            <div id="detected-notes"></div>
        </div>
    </div>
    <div class="fretboard-wrapper">
        <div class="fretboard" id="fretboard"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
